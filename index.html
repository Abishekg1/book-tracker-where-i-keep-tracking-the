<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
      <main class="container">
    <h1>Book Tracker</h1>
    <form id="book-form" class="book-form">
        <input type="text" id="title-input" placeholder="Book title" required>
        <input type="text" id="author-input" placeholder="Author" required>
        <button type="submit">Add book</button>
    </form>
    <ul id="book-list" class="book-list"></ul>
    <p id="empty-message" class="empty-message">
        No books yet. Add your first one above.
    </p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
